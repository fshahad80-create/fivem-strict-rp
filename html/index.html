<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRP HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <!-- عدّاد السجن -->
        <div id="jail" class="hidden">
            <div class="jail-title">تحت التوقيف</div>
            <div class="jail-timer" id="timer">00:00</div>
            <div class="jail-reason" id="reason"></div>
        </div>

        <!-- HUD الاحتياجات -->
        <div id="needs" class="hidden">
            <div class="need-row"><span class="need-ico">🍔</span><div class="bar"><div id="bar-hunger" class="fill hunger"></div></div></div>
            <div class="need-row"><span class="need-ico">💧</span><div class="bar"><div id="bar-thirst" class="fill thirst"></div></div></div>
            <div class="need-row"><span class="need-ico">⚡</span><div class="bar"><div id="bar-energy" class="fill energy"></div></div></div>
            <div class="need-row"><span class="need-ico">🚿</span><div class="bar"><div id="bar-hygiene" class="fill hygiene"></div></div></div>
        </div>

        <!-- شارة الطقس -->
        <div id="weather" class="hidden"><span id="weather-text">CLEAR</span></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
