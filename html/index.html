<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRP UI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div id="jail" class="hidden">
            <div class="jail-title">تحت التوقيف</div>
            <div class="jail-timer" id="timer">00:00</div>
            <div class="jail-reason" id="reason"></div>
        </div>
        <div id="needs" class="hidden">
            <div class="need-row"><span class="need-ico">🍔</span><div class="bar"><div id="bar-hunger" class="fill hunger"></div></div></div>
            <div class="need-row"><span class="need-ico">💧</span><div class="bar"><div id="bar-thirst" class="fill thirst"></div></div></div>
            <div class="need-row"><span class="need-ico">⚡</span><div class="bar"><div id="bar-energy" class="fill energy"></div></div></div>
            <div class="need-row"><span class="need-ico">🚿</span><div class="bar"><div id="bar-hygiene" class="fill hygiene"></div></div></div>
        </div>
        <div id="weather" class="hidden"><span id="weather-text">CLEAR</span></div>
        <div id="modal" class="hidden">
            <div class="modal-box">
                <div class="modal-head">
                    <span id="modal-title">القائمة</span>
                    <span class="modal-close" id="modal-close">✕</span>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-foot" id="modal-foot"></div>
            </div>
        </div>
        <div id="tablet" class="hidden">
            <div class="tablet-frame">
                <div class="tablet-top">
                    <span class="tablet-logo">SRP Tablet</span>
                    <span class="tablet-close" id="tablet-close">✕</span>
                </div>
                <div class="tablet-body">
                    <div class="app-grid" id="app-grid"></div>
                    <div class="app-content" id="app-content"><div class="app-empty">اختر تطبيقاً من الأعلى</div></div>
                </div>
            </div>
        </div>
        <div id="toast" class="hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
